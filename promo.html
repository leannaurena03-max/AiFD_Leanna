<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Four promotional images by Leanna Urena, featuring promo4.">
  <title>Promotional Gallery — Leanna Urena</title>
  <style>
    :root { --background: #FFFFFF; --text: #111111; --accent: #2E9B4F; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font: 400 16px/1.5 Arial, Helvetica, sans-serif; isolation: isolate; }
    h1, h2 { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; line-height: 1.25; }
    h1 { font-size: 24px; margin: 14px 0 0; }
    h2 { font-size: 18px; margin: 0; }
    a { color: inherit; text-underline-offset: 4px; }
    a:hover, a:focus-visible { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    .wrap { max-width: 1200px; margin: auto; padding: 0 32px; }
    .topbar, .footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 24px 0; font-size: 14px; }
    .topbar { border-bottom: 1px solid var(--accent); }
    .tag { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    .intro { padding: 48px 0; }
    .stripe { width: 64px; height: 8px; margin-bottom: 24px; background: var(--accent); }
    .intro p { margin: 16px 0 0; max-width: 520px; }
    figure { margin: 0; min-width: 0; }
    .featured { padding: 24px; border: 2px solid var(--accent); background: var(--background); }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    .badge { display: inline-block; padding: 6px 10px; background: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .image-link { display: block; text-decoration: none; }
    .image-link img { display: block; width: 100%; height: auto; }
    .featured .image-link { max-width: 720px; margin: auto; }
    .featured figcaption { max-width: 720px; margin: 16px auto 0; display: flex; justify-content: space-between; gap: 16px; font-size: 12px; }
    .supporting { padding: 48px 0; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 24px; align-items: start; }
    .card { padding: 16px; border: 1px solid var(--accent); background: var(--background); }
    .card figcaption { display: flex; justify-content: space-between; gap: 12px; padding-top: 16px; font-size: 12px; }
    .image-link:hover + figcaption .label, .image-link:focus-visible + figcaption .label { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .footer { border-top: 1px solid var(--accent); padding-bottom: 32px; }
    button { min-height: 44px; padding: 10px 16px; border: 1px solid var(--accent); border-radius: 0; color: var(--text); background: var(--background); font: inherit; cursor: pointer; }
    button:hover { text-decoration: underline; text-underline-offset: 4px; }
    .float-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .shape { position: absolute; bottom: -70px; width: var(--size); height: var(--size); left: var(--left); background: var(--accent); opacity: .09; animation: rise var(--duration) linear infinite; animation-delay: var(--delay); }
    .shape:nth-child(even) { border-radius: 50%; }
    .paused .shape { animation-play-state: paused; }
    @keyframes rise { from { transform: translateY(0) rotate(0); } to { transform: translateY(calc(-100vh - 140px)) rotate(45deg); } }
    @media (max-width: 1023px) {
      .wrap { padding: 0 24px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .shape:nth-child(n+9) { display: none; }
    }
    @media (max-width: 639px) {
      .wrap { padding: 0 16px; }
      h1 { font-size: 22px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 12px; }
      .tag { font-size: 10px; }
      .intro { padding: 32px 0; }
      .featured { padding: 16px; }
      .section-head { flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
      .supporting { padding: 32px 0; }
      .grid { grid-template-columns: 1fr; gap: 16px; }
      .footer { flex-wrap: wrap; }
      .shape:nth-child(n+7) { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shape { display: none; animation: none; }
      #motion { display: none; }
    }
  </style>
</head>
<body>
  <div class="float-layer" id="shapes" aria-hidden="true"></div>
  <div class="wrap">
    <nav class="topbar" aria-label="Page navigation">
      <a href="index.html">← Back to work</a>
      <span class="tag">Leanna Urena / A.I. for Designers</span>
    </nav>

    <main>
      <header class="intro">
        <div class="stripe" aria-hidden="true"></div>
        <span class="tag">Promotional design</span>
        <h1>A promotional poster</h1>
        <p>Four images. One in the spotlight.</p>
      </header>

      <!-- Keep promo1–promo4 in the same folder as this HTML.
           PNG is the default; the script also checks JPG, JPEG and WebP.
           If you use an images folder, update BOTH href and src below.
           Replace the alt text with a description of each image when added. -->
      <section class="featured" aria-labelledby="featured-title">
        <div class="section-head">
          <h2 id="featured-title">In the spotlight</h2>
          <span class="badge">Featured / 04</span>
        </div>
        <figure>
          <a class="image-link" href="promo4.png" aria-label="Open featured promotional image 4 at full size">
            <img src="promo4.png" alt="Featured promotional poster — image 4" data-promo="promo4" fetchpriority="high" decoding="async">
          </a>
          <figcaption><strong class="label">Promo 04</strong><span>View full size ↗</span></figcaption>
        </figure>
      </section>

      <section class="supporting" aria-labelledby="gallery-title">
        <h2 id="gallery-title">The collection</h2>
        <div class="grid">
          <figure class="card">
            <a class="image-link" href="promo1.png" aria-label="Open promotional image 1 at full size">
              <img src="promo1.png" alt="Promotional poster — image 1" data-promo="promo1" loading="lazy" decoding="async">
            </a>
            <figcaption><strong class="label">Promo 01</strong><span>View full size ↗</span></figcaption>
          </figure>
          <figure class="card">
            <a class="image-link" href="promo2.png" aria-label="Open promotional image 2 at full size">
              <img src="promo2.png" alt="Promotional poster — image 2" data-promo="promo2" loading="lazy" decoding="async">
            </a>
            <figcaption><strong class="label">Promo 02</strong><span>View full size ↗</span></figcaption>
          </figure>
          <figure class="card">
            <a class="image-link" href="promo3.png" aria-label="Open promotional image 3 at full size">
              <img src="promo3.png" alt="Promotional poster — image 3" data-promo="promo3" loading="lazy" decoding="async">
            </a>
            <figcaption><strong class="label">Promo 03</strong><span>View full size ↗</span></figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a href="index.html">← Back to work</a>
      <span class="tag">Leanna Urena · Promotional design</span>
      <button id="motion" type="button" aria-pressed="false">Pause animation</button>
    </footer>
  </div>

  <script>
    // Keep the images and their full-size links together if the file format changes.
    document.querySelectorAll('img[data-promo]').forEach(img => {
      const stem = img.getAttribute('src').replace(/\.[^.]+$/, '');
      const formats = ['jpg', 'jpeg', 'webp'];
      let next = 0;
      const tryNextFormat = () => {
        if (next >= formats.length) { img.onerror = null; return; }
        img.src = `${stem}.${formats[next++]}`;
        img.closest('a').href = img.getAttribute('src');
      };
      img.onerror = tryNextFormat;
      if (img.complete && !img.naturalWidth) tryNextFormat();
    });

    const layer = document.getElementById('shapes');
    for (let i = 0; i < 12; i++) {
      const shape = document.createElement('span');
      shape.className = 'shape';
      shape.style.setProperty('--size', `${20 + i * 4}px`);
      shape.style.setProperty('--left', `${(i * 8.3 + 2) % 100}%`);
      shape.style.setProperty('--duration', `${4 + (i % 5) * .5}s`);
      shape.style.setProperty('--delay', `${-i * .73}s`);
      layer.appendChild(shape);
    }
    document.getElementById('motion').addEventListener('click', function () {
      const paused = document.body.classList.toggle('paused');
      this.setAttribute('aria-pressed', String(paused));
      this.textContent = paused ? 'Resume animation' : 'Pause animation';
    });
  </script>
</body>
</html>
