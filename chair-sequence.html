<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:16px/1.6 Arial,Helvetica,sans-serif}main{max-width:1200px;margin:auto;padding:32px 20px}header{border-bottom:3px solid #2e9b4f;padding-bottom:18px;margin-bottom:28px}h1{font-size:24px;margin:0 0 8px}header p{margin:0}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}figure{margin:0;border:1px solid #ddd;min-width:0;background:white}img{display:block;width:100%;height:360px;object-fit:contain;background:#f3f3f3}figcaption{padding:18px}h2{font-size:18px;margin:0;color:#216f38}figcaption p{margin:10px 0 0;overflow-wrap:anywhere}@media(max-width:900px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){section{grid-template-columns:1fr}main{padding:24px 16px}img{height:auto;max-height:600px}}

body{isolation:isolate}main{position:relative;z-index:1}figure{background:rgba(255,255,255,.9)}
.background{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.shape{position:absolute;left:var(--x);bottom:-70px;width:var(--size);height:var(--size);background:#2e9b4f;opacity:var(--opacity);animation:float-up var(--duration) linear infinite;animation-delay:var(--delay)}
.shape:nth-child(odd){border-radius:50%}
@keyframes float-up{from{transform:translateY(0)}to{transform:translateY(calc(-100vh - 140px))}}
body.animation-paused .shape{animation-play-state:paused}
.animation-control{margin-top:28px;padding:10px 16px;min-height:44px;border:1px solid #2e9b4f;background:white;color:#111;font:inherit;cursor:pointer}
.animation-control:focus-visible{outline:2px solid #111;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.shape{animation:none;bottom:var(--rest)}.animation-control{display:none}}

.assignment-nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:24px 0;margin-bottom:24px;border-bottom:1px solid #2E9B4F;font-size:14px}

.assignment-nav a:hover{text-decoration-thickness:2px}

ny room.</p></figcaption></figure><figure><img src="chairsequence/chair3.jpg" alt="Chair image generation 3"><figcaption><h2>Generation 03</h2><p>A fat dark leather chair in the middle of a skinny room. It is bursting from the seams the walls can hardly contain it. There is a sense of suffocation. No windows, thin walls.</p></figcaption></figure><figure><img src="chairsequence/chair4.jpg" alt="Chair image generation 4"><figcaption><h2>Generation 04</h2><p>It is in the style of the old painting of Jesus. Like those old catholic renaissance painters. It’s an ominous inclusion in an otherwise pleasant scene.</p></figcaption></figure><figure><img src="chairsequence/chair5.jpg" alt="Chair image generation 5"><figcaption><h2>Generation 05</h2><p>Shot from a lower angle above to make the chair seem towering and imposing. Zoom out but change focal length to make chair seem bigger.</p></figcaption></figure><figure><img src="chairsequence/chair6.jpg" alt="Chair image generation 6"><figcaption><h2>Generation 06</h2><p>Remove this from the image. Make the sofa cleaner. White suede. Change nipple light and lighting of the scene to more cool tone.</p></figcaption></figure><figure><img src="chairsequence/chair7.jpg" alt="Chair image generation 7"><figcaption><h2>Generation 07</h2><p>Make it the chair image into style of basquiat with new colors</p></figcaption></figure><figure><img src="chairsequence/chair8.jpg" alt="Chair image generation 8"><figcaption><h2>Generation 08</h2><p>I added some details I want in white. Make this chair sofa a dope throne with a dude laid up in Splendor. White clothing white hood covering most of his face.</p></figcaption></figure><figure><img src="chairsequence/chair9.jpg" alt="Chair image generation 9"><figcaption><h2>Generation 09</h2><p>Make him clean white. Not a speck of paint on him. Everything else remains same.</p></figcaption></figure><figure><img src="chairsequence/chair10.jpg" alt="Chair image generation 10"><figcaption><h2>Final</h2></figcaption></figure></section><button class="animation-control" id="animation-control" type="button" aria-pressed="false">Pause animation</button></main><script>

 const paused=document.body.classList.toggle('animation-paused');

</script></body></html>
